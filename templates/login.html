{{define "content"}}
<div class="auth-card">
  {{if .School.HasLogo}}
    <img src="/logo?v={{.School.LogoVersion}}" alt="" class="brand-logo big">
  {{else}}
    <span class="brand-mark big">{{.School.Initial}}</span>
  {{end}}
  <h2>Welcome back</h2>
  <p class="muted">Sign in to {{.School.Name}}.</p>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/login">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">

    <button type="submit" class="block">Sign in</button>
  </form>
  <p class="muted small">Accounts are created by your school administrator.</p>
</div>
{{end}}
