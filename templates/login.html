{{define "content"}}
<div class="auth-card">
  <span class="brand-mark big">S</span>
  <h2>Welcome back</h2>
  <p class="muted">Sign in to your School Management account.</p>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/login">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">

    <button type="submit" class="block">Sign in</button>
  </form>
  <p class="muted small">Accounts are created by your school administrator.</p>
</div>
{{end}}
