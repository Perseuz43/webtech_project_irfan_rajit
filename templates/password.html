{{define "content"}}
{{$d := .Data}}
<h2>Change password</h2>
<p><a href="/dashboard">&larr; Dashboard</a></p>
{{if $d.Changed}}<p class="success">Your password was changed.</p>{{end}}
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}

<form method="post" action="{{$d.Action}}" class="card wide">
  <label for="current_password">Current password</label>
  <input type="password" id="current_password" name="current_password" required autocomplete="current-password">

  <label for="new_password">New password</label>
  <input type="password" id="new_password" name="new_password" required minlength="8" maxlength="72" autocomplete="new-password">

  <label for="confirm_password">Confirm new password</label>
  <input type="password" id="confirm_password" name="confirm_password" required minlength="8" maxlength="72" autocomplete="new-password">

  <p class="muted small">Use at least 8 characters. Do not reuse a password from another site.</p>
  <button type="submit">Change password</button>
</form>
{{end}}
